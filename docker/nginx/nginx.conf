events {
    worker_connections 1024;
}

http {
    # Redirect all HTTP requests to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # Serve HTTPS proxy to Next.js dev server on host
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Disable response buffering for Server-Sent Events / streaming endpoints
        proxy_buffering off;

        location / {
            # Route traffic to the Next.js dev server running on the host machine
            proxy_pass http://host.docker.internal:3000;
            
            # WebSocket and Connection headers for Next.js HMR/WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Forward host headers and client IPs
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
