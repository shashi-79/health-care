services:
  postgres:
    image: postgres:16-alpine
    container_name: rhc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rhc
      POSTGRES_USER: rhc
      POSTGRES_PASSWORD: rhc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
